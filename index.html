<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A contemporary, design-forward portfolio website for Communication Design student Anushka Saraf." />
    <meta property="og:title" content="Remix Remix Remix Anushka Saraf Portfolio" />
    <meta property="og:description" content="A contemporary, design-forward portfolio website for Communication Design student Anushka Saraf." />
    <title>Remix Remix Remix Anushka Saraf Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              cream: '#FAF8F6',
              charcoal: '#121212',
              neutral: {
                gray: '#6E6A66',
              },
              coral: '#E8552E',
              lavender: '#6D5AE6',
              stone: {
                50: '#FAF9F7',
                100: '#F4F1EE',
                200: '#E6E1DC',
                300: '#D5CEC7',
                400: '#A39C95',
                500: '#736D67',
                600: '#544F4A',
                700: '#3E3A37',
                800: '#262422',
                850: '#1D1B1A',
                900: '#151413',
                950: '#0C0B0A',
              }
            },
            fontSize: {
              xs: ['13px', { lineHeight: '1.35' }],
              sm: ['14px', { lineHeight: '1.45' }],
              base: ['16px', { lineHeight: '1.6' }],
              lg: ['18px', { lineHeight: '1.55' }],
              xl: ['20px', { lineHeight: '1.4' }],
              '2xl': ['24px', { lineHeight: '1.3' }],
              '3xl': ['30px', { lineHeight: '1.2' }],
              '4xl': ['36px', { lineHeight: '1.15' }],
              '5xl': ['48px', { lineHeight: '1.08' }],
              '6xl': ['60px', { lineHeight: '1.04' }],
              '7xl': ['72px', { lineHeight: '1' }],
            },
            fontFamily: {
              name: ['var(--font-hero-name)', 'serif'],
              heading: ['var(--font-main-heading)', 'Fraunces', 'Playfair Display', 'serif'],
              editorial: ["'Fraunces'", "'Playfair Display'", 'Georgia', 'serif'],
              clean: ["'Plus Jakarta Sans'", 'var(--font-body-text)', 'sans-serif'],
              subheading: ["'Plus Jakarta Sans'", 'var(--font-sub-heading)', 'sans-serif'],
              body: ["'Plus Jakarta Sans'", 'var(--font-body-text)', 'sans-serif'],
              alasassy: ["'Alasassy Caps'", 'Crushed', 'sans-serif'],
              fresca: ["'Fresca'", 'sans-serif'],
              highlight: ["'JetBrains Mono'", 'var(--font-highlight)', 'monospace'],
              sans: ["'Plus Jakarta Sans'", 'var(--font-body-text)', 'sans-serif'],
              serif: ["'Fraunces'", "'Playfair Display'", 'serif'],
              mono: ["'JetBrains Mono'", 'monospace'],
              handwriting: ['Caveat', 'cursive'],
            },
            animation: {
              'fadeIn': 'fadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'bounce': 'bounce 2s infinite',
              'popIn': 'popIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'float': 'float 6s ease-in-out infinite',
              'marquee': 'marquee 25s linear infinite',
              'blob': 'blob 7s infinite',
              'gradient': 'gradient 8s ease infinite',
              'shimmer': 'shimmer 1.5s infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(8px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              popIn: {
                '0%': { opacity: '0', transform: 'scale(0.92)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-14px)' },
              },
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-100%)' },
              },
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              gradient: {
                '0%': { backgroundPosition: '0% 50%' },
                '50%': { backgroundPosition: '100% 50%' },
                '100%': { backgroundPosition: '0% 50%' },
              },
              shimmer: {
                '100%': { transform: 'translateX(100%)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Crushed&family=Didact+Gothic&family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..500&family=Fredericka+the+Great&family=Fresca&family=Gabriela&family=Glass+Antiqua&family=JetBrains+Mono:wght@400;500&family=Moirai+One&family=Playfair+Display:ital,wght@0,400..600;1,400..500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Ribeye+Marrow&family=Rozha+One&display=swap');

      /* Optional local Alasassy Caps & Darrell Rolando font support */
      @font-face {
        font-family: 'Alasassy Caps';
        src: local('Alasassy Caps'), local('AlasassyCaps');
      }

      @font-face {
        font-family: 'darrell rolando';
        src: local('Darrell Rolando'), local('DarrellRolando'), local('darrell rolando');
      }

      /* Explicit helper classes for targeted typography */
      .font-alasassy {
        font-family: 'Alasassy Caps', 'Crushed', sans-serif !important;
      }
      .font-fresca {
        font-family: 'Fresca', sans-serif !important;
      }

      :root {
        /*
         * --------------------------------------------------------
         * 1. FONT FAMILIES
         * --------------------------------------------------------
         */
        --font-main-heading: 'Alasassy Caps';
        --font-sub-heading: 'didact gothic';
      
        /* Body Text & Captions: 'Fresca' / 'Glass Antiqua' */
        --font-body-text: 'didact gothic', sans-serif;
        --font-highlight: 'didact gothic', monospace;

        /* Hero Name Font: Regular, unbolded */
        --font-hero-name: 'darrell rolando', cursive;

        /*
         * --------------------------------------------------------
         * 2. FONT SIZES (Backend configurable font sizing)
         * --------------------------------------------------------
         * Enforcing strict consistency: Standard body = 16px, Min = 13px
         */
        --font-size-base: 18px;          /* Base browser root scale */
        --font-size-body: 16px;          /* Standard body copy (strictly 16px) */
        --font-size-caption: 13px;       /* Minimum caption/tag scale (strictly 13px min) */
        --font-size-subheading: 20px;    /* Subheadings */
        --font-size-heading: 42px;       /* Main section headings */
        --font-size-hero-name: clamp(2.65rem, 6.2vw, 6rem); /* Hero name single-line scale */
        --line-height-body: 1.6;         /* Body text line height */
      }

      html {
        font-size: var(--font-size-base);
        scroll-padding-top: 100px;
      }

      body {
        font-family: var(--font-body-text);
        font-size: var(--font-size-body);
        line-height: var(--line-height-body);
      }

      p {
        font-size: var(--font-size-body);
        line-height: var(--line-height-body);
      }

      /* Keep resume sheet print and screen typography strictly compact and proportional */
      .resume-sheet p {
        font-size: 13px;
        line-height: 1.4;
      }

      .caption, figcaption, .text-caption {
        font-size: var(--font-size-caption);
      }
      
      h1, h2, h3, h4, h5, h6 {
        letter-spacing: -0.02em;
      }

      .serif {
        font-family: 'fresca';
      }
      
      /* Hide scrollbar for clean modal */
      .no-scroll {
        overflow: hidden;
      }
      
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #FF3366; /* New Pink thumb */
        border-radius: 20px;
      }

      /* Infinite Marquee Animation for Skills Slider */
      @keyframes marquee-left {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      @keyframes marquee-right {
        0% { transform: translateX(-50%); }
        100% { transform: translateX(0); }
      }
      .animate-marquee-left {
        display: flex;
        width: max-content;
        animation: marquee-left 35s linear infinite;
      }
      .animate-marquee-right {
        display: flex;
        width: max-content;
        animation: marquee-right 35s linear infinite;
      }
      .marquee-pause:hover .animate-marquee-left,
      .marquee-pause:hover .animate-marquee-right {
        animation-play-state: paused;
      }

      /* Print Styles for Resume Download */
      @media print {
        @page {
          size: A4 portrait;
          margin: 0;
        }
        
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        html, body {
          width: 210mm !important;
          height: 297mm !important;
          margin: 0 !important;
          padding: 0 !important;
          overflow: hidden !important;
          background: #ffffff !important;
        }
        
        /* Hide everything else */
        body > *:not(#root) { display: none !important; }
        nav, footer, #hero, #about, #skills, #contact, #work, #custom-cursor, .fixed, #scroll-progress { 
          display: none !important; 
        }
        
        #root, main, .min-h-screen {
          margin: 0 !important;
          padding: 0 !important;
          background: transparent !important;
          height: auto !important;
          min-height: 0 !important;
        }
        
        #resume {
          display: block !important;
          position: absolute !important;
          top: 0 !important;
          left: 0 !important;
          width: 210mm !important;
          height: 297mm !important;
          margin: 0 !important;
          padding: 0 !important;
          box-sizing: border-box !important;
          page-break-after: avoid !important;
          page-break-before: avoid !important;
          page-break-inside: avoid !important;
          overflow: hidden !important;
        }

        #resume > .container {
          width: 210mm !important;
          max-width: 210mm !important;
          height: 297mm !important;
          margin: 0 !important;
          padding: 0 !important;
        }

        .resume-sheet {
          width: 210mm !important;
          height: 297mm !important;
          max-width: 210mm !important;
          max-height: 297mm !important;
          box-shadow: none !important;
          border-radius: 0 !important;
          border: none !important;
          margin: 0 !important;
        }
      }
    </style>

</script>
